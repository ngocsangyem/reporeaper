name: CI

on:
  push:
    branches: [main]
  pull_request:

# This project's whole subject is deleting repositories, so the workflow token
# is pinned to the minimum rather than left at the repository default.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main build; superseded PR runs are fine to drop.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      # Token hygiene is a merge gate, not a release-time check. `pnpm hygiene`
      # first self-tests the harness against known-hard leak shapes, so a gate
      # that has stopped detecting anything fails instead of reporting green.
      - name: Token hygiene (runtime sentinel)
        run: pnpm hygiene

      # Catches a tarball that still depends on the private @reporeaper/*
      # packages — invisible inside the workspace, fatal for every installer.
      - name: Verify published tarball
        run: pnpm verify:tarball

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
